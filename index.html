<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO LUXE 予約管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Cormorant+Garamond:wght@300;400;600&display=swap');

  :root {
    --gold: #c9a96e;
    --dark: #0a0a0a;
    --dark2: #111111;
    --dark3: #1a1a1a;
    --dark4: #222222;
    --text: #e8e8e8;
    --text-muted: #888;
    --border: #2a2a2a;
    --success: #4caf7d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 20px;
  }

  .header {
    text-align: center;
    padding: 30px 0 20px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 30px;
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2rem;
    font-weight: 300;
    color: var(--gold);
    letter-spacing: 0.3em;
  }

  .header p {
    color: var(--text-muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    margin-top: 6px;
  }

  .card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .card-title {
    font-size: 0.7rem;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 0.72rem;
    color: var(--text-muted);
    letter-spacing: 0.1em;
  }

  input, select {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.9rem;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  input:focus, select:focus { border-color: var(--gold); }
  select option { background: var(--dark3); }

  .options-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .option-btn {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.75rem;
    padding: 8px 4px;
    text-align: center;
    transition: all 0.2s;
    user-select: none;
    line-height: 1.5;
  }

  .option-btn.active {
    background: var(--dark4);
    border-color: var(--gold);
    color: var(--gold);
  }

  .option-price {
    font-size: 0.65rem;
    color: var(--gold);
    opacity: 0.8;
  }

  .generate-btn {
    background: linear-gradient(135deg, var(--gold), #a07840);
    border: none;
    border-radius: 10px;
    color: var(--dark);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 16px;
    transition: opacity 0.2s;
    width: 100%;
    margin-top: 8px;
  }

  .generate-btn:hover { opacity: 0.9; }

  .output-box {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-top: 12px;
  }

  .output-label {
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    color: var(--gold);
    margin-bottom: 10px;
  }

  .output-text {
    color: var(--text);
    font-size: 0.85rem;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .copy-btn {
    background: var(--dark4);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 0.75rem;
    margin-top: 12px;
    padding: 8px 16px;
    transition: all 0.2s;
    width: 100%;
  }

  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
  .copy-btn.copied { border-color: var(--success); color: var(--success); }

  .price-display {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
  }

  .price-label { font-size: 0.78rem; color: var(--text-muted); }
  .price-value { font-size: 1.1rem; color: var(--gold); font-weight: 500; }

  @media (max-width: 480px) {
    .form-grid { grid-template-columns: 1fr; }
    .options-grid { grid-template-columns: repeat(2, 1fr); }
    .header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>NEO LUXE</h1>
  <p>RESERVATION MANAGEMENT</p>
</div>

<div class="card">
  <div class="card-title">予約情報</div>
  <div class="form-grid">
    <div class="form-group">
      <label>セラピスト名</label>
      <select id="therapist">
        <option value="">選択してください</option>
        <option>みく</option>
        <option>りょう</option>
        <option>ゆとり</option>
        <option>かすみ</option>
        <option>のあ</option>
        <option>れい</option>
        <option>ゆゆ</option>
        <option>ちどり</option>
        <option>さき</option>
        <option>ゆな</option>
        <option>あいな</option>
        <option>かほ</option>
      </select>
    </div>

    <div class="form-group">
      <label>指名種別</label>
      <select id="shimei">
        <option value="フリー">フリー</option>
        <option value="指名">指名</option>
        <option value="本指名">本指名</option>
      </select>
    </div>

    <div class="form-group">
      <label>予約日時</label>
      <input type="datetime-local" id="datetime">
    </div>

    <div class="form-group">
      <label>コース</label>
      <select id="course">
        <option value="スタンダード">スタンダード</option>
        <option value="レオナール">レオナール</option>
        <option value="アルミラージ">アルミラージ</option>
      </select>
    </div>

    <div class="form-group">
      <label>コース時間（分）</label>
      <select id="duration">
        <option value="60">60分</option>
        <option value="75">75分</option>
        <option value="90">90分</option>
        <option value="100">100分</option>
        <option value="120">120分</option>
      </select>
    </div>

    <div class="form-group">
      <label>部屋番号</label>
      <input type="text" id="room" placeholder="例：503">
    </div>

    <div class="form-group">
      <label>お客様名</label>
      <input type="text" id="customer" placeholder="例：カジ様">
    </div>

    <div class="form-group">
      <label>コース料金（円）</label>
      <input type="number" id="coursePrice" placeholder="例：15000" oninput="calcTotal()">
    </div>

    <div class="form-group">
      <label>指名料（円）</label>
      <select id="shimeiPrice" onchange="calcTotal()">
        <option value="0">0円</option>
        <option value="1000">1,000円</option>
        <option value="2000">2,000円</option>
        <option value="3000">3,000円</option>
      </select>
    </div>
  </div>

  <!-- オプション -->
  <div style="margin-top: 16px;">
    <label style="display:block; margin-bottom: 10px; font-size: 0.72rem; color: var(--text-muted); letter-spacing: 0.1em;">
      オプション &nbsp;<span style="font-size:0.65rem;">（お客様料金 / セラピストバック）</span>
    </label>
    <div class="options-grid">
      <div class="option-btn" onclick="toggleOption(this, 'スタ増量', 1500, 1000)">
        スタ増量<br><span class="option-price">¥1,500 / ¥1,000</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, 'レオ増量', 2000, 1500)">
        レオ増量<br><span class="option-price">¥2,000 / ¥1,500</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, 'アル増量', 2500, 2000)">
        アル増量<br><span class="option-price">¥2,500 / ¥2,000</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, '贅沢', 3000, 2000)">
        贅沢<br><span class="option-price">¥3,000 / ¥2,000</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, '集中', 1000, 1000)">
        集中<br><span class="option-price">¥1,000 / ¥1,000</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, '衣装', 3000, 2000)">
        衣装<br><span class="option-price">¥3,000 / ¥2,000</span>
      </div>
      <div class="option-btn" onclick="toggleOption(this, 'ヘッドスパ', 1000, 1000)">
        ヘッドスパ<br><span class="option-price">¥1,000 / ¥1,000</span>
      </div>
    </div>
  </div>

  <!-- 割引 -->
  <div class="form-grid" style="margin-top: 14px;">
    <div class="form-group">
      <label>割引内容</label>
      <input type="text" id="discount" placeholder="例：初回割引">
    </div>
    <div class="form-group">
      <label>割引額（円）</label>
      <input type="number" id="discountAmount" placeholder="0" oninput="calcTotal()">
    </div>
  </div>

  <div class="price-display">
    <span class="price-label">お客様支払い合計</span>
    <span class="price-value" id="totalPrice">¥0</span>
  </div>

  <button class="generate-btn" onclick="generate()">定型文を生成する</button>
</div>

<!-- SMS出力 -->
<div class="card" id="smsCard" style="display:none;">
  <div class="card-title">お客様SMS</div>
  <div class="output-box">
    <div class="output-label">▼ コピーしてSMSに貼り付け</div>
    <div class="output-text" id="smsText"></div>
  </div>
  <button class="copy-btn" id="smsCopyBtn" onclick="copyText('smsText', 'smsCopyBtn')">📋 コピー</button>
</div>

<!-- LINE出力 -->
<div class="card" id="lineCard" style="display:none;">
  <div class="card-title">セラピストLINE</div>
  <div class="output-box">
    <div class="output-label">▼ コピーしてLINEに貼り付け</div>
    <div class="output-text" id="lineText"></div>
  </div>
  <button class="copy-btn" id="lineCopyBtn" onclick="copyText('lineText', 'lineCopyBtn')">📋 コピー</button>
</div>

<script>
  let selectedOptions = [];

  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById('datetime').value = now.toISOString().slice(0,16);

  function toggleOption(el, name, price, back) {
    const idx = selectedOptions.findIndex(o => o.name === name);
    if (idx >= 0) {
      selectedOptions.splice(idx, 1);
      el.classList.remove('active');
    } else {
      selectedOptions.push({ name, price, back });
      el.classList.add('active');
    }
    calcTotal();
  }

  function calcTotal() {
    const coursePrice = parseInt(document.getElementById('coursePrice').value) || 0;
    const shimeiPrice = parseInt(document.getElementById('shimeiPrice').value) || 0;
    const discountAmount = parseInt(document.getElementById('discountAmount').value) || 0;
    const optionTotal = selectedOptions.reduce((s, o) => s + o.price, 0);
    const total = coursePrice + shimeiPrice + optionTotal - discountAmount;
    document.getElementById('totalPrice').textContent = '¥' + total.toLocaleString();
    return total;
  }

  function formatDatetime(dtStr) {
    const dt = new Date(dtStr);
    const month = dt.getMonth() + 1;
    const day = dt.getDate();
    const hours = dt.getHours();
    const minutes = String(dt.getMinutes()).padStart(2, '0');
    return {
      date: `${month}/${day}`,
      time: `${hours}時${minutes}分`,
      full: `${month}/${day}  ${hours}:${minutes}`
    };
  }

  function generate() {
    const therapist = document.getElementById('therapist').value;
    const shimei = document.getElementById('shimei').value;
    const datetimeStr = document.getElementById('datetime').value;
    const course = document.getElementById('course').value;
    const duration = document.getElementById('duration').value;
    const room = document.getElementById('room').value;
    const customer = document.getElementById('customer').value;
    const coursePrice = parseInt(document.getElementById('coursePrice').value) || 0;
    const discount = document.getElementById('discount').value;
    const total = calcTotal();

    if (!therapist || !room || !datetimeStr) {
      alert('セラピスト・部屋番号・日時は必須です');
      return;
    }

    const dt = formatDatetime(datetimeStr);
    const optionNames = selectedOptions.length > 0 ? selectedOptions.map(o => o.name).join('・') : '';
    const courseLabel = `${course}${duration}`;

    const sms = `メンズエステ店の中からNEO LUXEをお選びいただき、
誠に有難うございます。
当店は【厳選されたセラピスト】のみが在籍している店舗でございます。
自信を持ってご案内させていただきます。
お客様にとって癒しのお時間になる事を心より願っております🌱
【〒790-0878】
【勝山アリストシード】
松山市勝山町1丁目1-15
時間:${dt.full}
ルーム:${room}
上記のマンションに到着されましたらお手数をおかけしますが、
以下のURLをタップしていただき、
【電話】を押しご連絡をよろしくお願いいたします。
https://estama.jp/shop/29585/`;

    const line = `▫日付:${dt.date}
▫担当セラピスト: ${therapist}${shimei === 'フリー' ? '' : shimei}
▫時間:${dt.time}
▫コース:${courseLabel}
▫オプション:${optionNames}
▫お名前:${customer}
▫割引内容:${discount}
▫お客様支払い合計:${total.toLocaleString()}`;

    document.getElementById('smsText').textContent = sms;
    document.getElementById('lineText').textContent = line;
    document.getElementById('smsCard').style.display = 'block';
    document.getElementById('lineCard').style.display = 'block';
    document.getElementById('smsCard').scrollIntoView({ behavior: 'smooth' });
  }

  function copyText(id, btnId) {
    const text = document.getElementById(id).textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById(btnId);
      btn.textContent = '✅ コピーしました';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 コピー';
        btn.classList.remove('copied');
      }, 2000);
    });
  }
</script>
</body>
</html>
